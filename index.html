<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shersingh Charan | Portfolio</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius:24px;
      padding:30px 25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }

    .avatar{
      width:110px;
      height:110px;
      border-radius:50%;
      background:#ffffff22;
      margin:0 auto 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:50px;
      border:2px solid #ffffff33;
    }

    h1{
      font-size:2rem;
      margin-bottom:8px;
    }

    .role{
      color:#cbd5e1;
      margin-bottom:20px;
      font-size:1rem;
    }

    .about{
      line-height:1.6;
      color:#e2e8f0;
      margin-bottom:28px;
      font-size:0.95rem;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-bottom:28px;
    }

    .skill{
      background:#ffffff14;
      border:1px solid #ffffff1f;
      padding:8px 14px;
      border-radius:999px;
      font-size:0.9rem;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .btn{
      display:block;
      text-decoration:none;
      padding:14px;
      border-radius:12px;
      font-weight:bold;
      transition:0.2s;
    }

    .primary{
      background:white;
      color:#0f172a;
    }

    .primary:hover{
      transform:translateY(-2px);
    }

    .secondary{
      border:1px solid #ffffff33;
      color:white;
      background:#ffffff0d;
    }

    .secondary:hover{
      background:#ffffff18;
    }

    footer{
      margin-top:25px;
      font-size:0.85rem;
      color:#94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">👨‍💻</div>

    <h1>Shersingh Charan</h1>
    <p class="role">Web Developer • Student • Learner</p>

    <p class="about">
      Welcome to my portfolio website! I am learning web development and
      building modern websites using HTML, CSS and GitHub Pages.
    </p>

    <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">JavaScript</span>
      <span class="skill">GitHub</span>
    </div>

    <div class="buttons">
      <a class="btn primary" href="https://github.com/charan785192-arch" target="_blank">
        Visit My GitHub
      </a>

      <a class="btn secondary" href="mailto:your-email@example.com">
        Contact Me
      </a>
    </div>

    <footer>
      © 2026 Shersingh Charan. All rights reserved.
    </footer>
  </div>

</body>
</html>
